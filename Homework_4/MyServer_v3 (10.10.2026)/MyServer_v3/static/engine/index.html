<!doctype html>
<html lang="en">
<head>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .header{
            width: auto;
            height: 70px;
            margin: 35px 35px 0 35px;
        }

        .header__temperature{
            margin: 0 0 auto auto;
            width: 44px;
            height: 43px;
            font-family: 'Afacad', 'sans-serif';
            font-weight: bold;
            font-size: 32px;
            letter-spacing: 0;
            color: #212121;
        }

        .header__city{
            margin: auto 0 0 auto;
            width: 98px;
            height: 27px;
            font-family: 'Afacad', 'sans-serif';
            font-weight: bold;
            font-size: 20px;
            letter-spacing: 0;
            color: #6E6CDF;
        }

        .main__container{
            display: flex;
            flex-direction: column;
            margin: 255px 6px;
            width: auto;
            height: 397px;
        }

        .main__content{
            display: flex;
            position-area: top;
            width: 100%;
            height: 156px;
            align-items: center;
            justify-content: center;
            flex-direction: column;

        }

        .main__content-time{
            display: flex;
            width: 281px;
            height: 99px;
            font-family: 'Afacad', 'sans-serif';
            font-weight: bold;
            font-size: 74px;
            line-height: 100%;
            letter-spacing: 0;
            opacity: 1;
            align-items: center;
            color: #212121;
        }

        .main__content-text{
            display: flex;
            margin: 9.28px 7.5px 0 7.5px;
            width: 296px;
            height: 48px;
            font-family: 'Afacad', 'sans-serif';
            font-weight: bold;
            font-size: 36px;
            line-height: 100%;
            letter-spacing: 0;
            align-items: center;
            color: #6E6CDF;
        }

        .main__search-and-links{
            display: flex;
            position-area: bottom;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            width: 621.45px;
            height: 185.75px;
            margin: 55.65px auto 0 auto;
        }

        .search-box{
            display: flex;
            width: 621.45px;
            height: 65.1px;
            gap: 9.28px;
            border: 1.16px solid #EEEEEE;
            border-radius: 18.55px;
            border-width: 1.16px;
            padding: 18.55px 27.83px;
            background: #FAFAFA;
            align-items: center;
            margin-bottom: auto;
        }

        .search_icon{
            width: 28px;
            height: 28px;
        }

        .search-input{
            display: flex;
            width: 100%;
            height: 28px;
            font-family: "Poppins", sans-serif;
            font-weight: 400;
            font-size: 20px;
            line-height: 140%;
            letter-spacing: 0.23px;
            color: #9E9E9E;
            background: #FAFAFA;
            border: none;
            outline: none;
        }

        .search-input::placeholder{
            color: #9E9E9E;
            width: 72px;
            height: 28px;
            font-family: "Poppins", sans-serif;
            font-weight: 400;
            font-size: 20px;
            line-height: 140%;
            letter-spacing: 0.23px;
        }

        .social-links-box{
            display: flex;
            width: 100%;
            height: 65px;
            justify-content: space-between;
            align-items: center;
        }

        .social-link-box{
            display: flex;
            width: 65px;
            height: 65px;
            border-radius: 18.57px;
            background: #FAFAFA;
            border: 1.16px solid #EEEEEE;
            justify-content: center;
            align-items: center;
        }

        .social-link{
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .social-link-icon{
            width: 32.5px;
            height: 32.5px;
            transition: 0.5s;
        }

        .social-link-icon:hover{
            scale: 1.2;
        }


        /*phone */
        @media (max-width: 393px){
            .header{
                margin: 20px 24px 0 24px;
                height: 48px;
            }

            .header__temperature{
                font-size: 22px;
                width: 31px;
                height: 29px;
            }

            .header__city{
                width: 68px;
                height: 19px;
                font-size: 14px;
            }

            .main__container{
                margin: 216px 0 119px 0;
            }

            .main__content{
                height: 104px;
            }

            .main__content-time{
                width: 182px;
                height: 64px;
                font-size: 48px;
            }

            .main__content-text{
                margin: auto auto 0 auto;
                width: 198px;
                height: 32px;
                font-size: 24px;
            }

            .main__search-and-links{
                width: 345px;
                height: 129px;
                margin: 216px 24px 119px 24px;
            }

            .search-box{
                width: 345px;
                height: 57px;
                border-radius: 16px;
                border: 1px solid #EEEEEE;
                padding: 16px 24px;
            }

            .search_icon{
                width: 24px;
                height: 24px;
            }

            .search-input{
                height: 25px;
                font-size: 18px;
                letter-spacing: 0.2px;
            }

            .search-input::placeholder{
                width: 65px;
                height: 25px;
                font-size: 18px;
                letter-spacing: 0.2px;
            }

            .social-links-box{
                width: 100%;
                height: 48px;
                margin: 24px 4.5px 0 4.5px;
                overflow-x: auto;
                gap: 24px;
            }

            .social-link-box{
                min-width: 48px;
                height: 48px;
                border-radius: 16px;
                border: 1px solid #EEEEEE;
            }

            .social-link-icon{
                width: 28px;
                height: 28px;
            }
        }

    </style>
