<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница не найдена — 404</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7f9fa;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 500px;
        }

        .error-code {
            font-size: 120px;
            font-weight: 900;
            line-height: 1;
            color: #2d3748;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h1 {
            font-size: 24px;
            color: #4a5568;
            margin-bottom: 15px;
        }

        p {
            font-size: 16px;
            color: #718096;
            margin-bottom: 30px;
            line-height: 1.5;
        }        
    </style>
</head>
<body>

    <div class="container">
        <div class="error-code">404</div>
        <h1>Упс... Страница не найдена</h1>
        <p>Возможно, она была удалена, переименована или никогда не существовала. Проверьте правильность введенного адреса.</p>
    </div>

</body>
</html>
